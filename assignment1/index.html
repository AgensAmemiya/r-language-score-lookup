eedback": "小组联合提交一份作业，Figure 2—5 与 Table 1—4 均已呈现，心得 876 字。与要求的差距：Table 3、Table 4 是把原文数值手工录入，不是重跑模型；4 张表都没有表题，图题 1—5 与正文引用不一致；代码用 C:/Users/田文秋/… 绝对路径；没有提示词记录；评价多处留有余地。", "detail": {"复盘": "1.5", "复刻": "2", "提示词·代码": "0.5", "规范": "1", "心得": "1", "评价": "1"}}, {"id": "2601212315", "name": "黄樾", "group": "第5组", "mode": "小组B（联合提交）", "score": "7", "feedback": "小组联合提交一份作业，参与表格与图形的复刻，心得 762 字，其中记录了自己发现 GIVE 编码错误的过程。与要求的差距：Table 3、Table 4 为录入而非重算，4 张表无表题；代码绝对路径；没有提示词记录。", "detail": {"复盘": "1.5", "复刻": "2", "提示词·代码": "0.5", "规范": "1", "心得": "1", "评价": "1"}}, {"id": "2601212312", "name": "周梦婕", "group": "第5组", "mode": "小组B（联合提交）", "score": "7", "feedback": "小组联合提交一份作业，心得 1,008 字，按“优势与局限—人工修正—思考与规划”写全，含路径不统一、反引号吞代码等具体教训。与要求的差距：Table 3、Table 4 为录入而非重算，4 张表无表题；代码绝对路径；没有提示词记录。", "detail": {"复盘": "1.5", "复刻": "2", "提示词·代码": "0.5", "规范": "1", "心得": "1", "评价": "1"}}, {"id": "2601212308", "name": "魏敏慧", "group": "第5组", "mode": "小组B（联合提交）", "score": "7", "feedback": "小组联合提交一份作业，心得 1,724 字，从旁观到独立跑通，写清三条优势、三条局限与四条规划。与要求的差距：Table 3、Table 4 为录入而非重算，4 张表无表题；代码绝对路径；没有提示词记录。", "detail": {"复盘": "1.5", "复刻": "2", "提示词·代码": "0.5", "规范": "1", "心得": "1", "评价": "1"}}, {"id": "2601111463", "name": "白家蕾", "group": "第4组", "mode": "个人", "score": "9.5", "feedback": "复盘四要素齐全，5 图 16 表都有编号，提示词按“情境—任务—输出—约束”完整给出，心得 1,050 字。与要求的差距：脚本 source 用 C:/Users/menna/… 绝对路径，换一台电脑需先改路径；交付 53 个文件，作者代码与原始数据各存两份；审计类表格只编到“表13”，与正文引用没有完全对应。", "detail": {"复盘": "2", "复刻": "2.5", "提示词·代码": "1", "规范": "2", "心得": "1", "评价": "1"}}];
const form=document.querySelector('form'), input=document.querySelector('#sid'), result=document.querySelector('#result'), error=document.querySelector('#error');
form.addEventListener('submit', e=>{e.preventDefault(); const sid=input.value.trim(); const row=records.find(x=>x.id===sid); error.hidden=true; result.hidden=true; if(!/^\d{10}$/.test(sid)){error.textContent='请输入 10 位数字学号。';error.hidden=false;return} if(!row){error.textContent='未找到该学号，请检查是否输入正确。';error.hidden=false;return} document.querySelector('#name').textContent=row.name; document.querySelector('#group').textContent=row.group; document.querySelector('#score').textContent=row.score; document.querySelector('#mode').textContent=row.mode||'团队共享'; Object.entries(row.detail).forEach(([k,v])=>document.querySelector('[data-k="'+CSS.escape(k)+'"]').textContent=v); document.querySelector('#feedback').textContent=row.feedback;  result.hidden=false; result.scrollIntoView({behavior:'smooth',block:'start'}); });</script></body></html>
